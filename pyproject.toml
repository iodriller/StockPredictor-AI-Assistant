[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpredictor"
version = "0.1.0"
description = "Configuration-first stock prediction and trading intelligence research suite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=5.20",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "streamlit>=1.32",
    "uvicorn[standard]>=0.27",
    "yfinance>=0.2.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    # Browser UI diagnosis (Streamlit dashboard at :8501): after installing, run: python -m playwright install chromium
    "playwright>=1.40",
]

[project.scripts]
stockpredictor = "stockpredictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
extend-exclude = ["finance_app.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
