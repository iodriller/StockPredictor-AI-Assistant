app:
  name: StockPredictor Trading Intelligence
  environment: local
  timezone: America/Chicago
  market_timezone: America/New_York

data:
  provider: yfinance
  period: 6mo
  interval: 1d
  benchmark: SPY
  min_rows: 80
  allow_synthetic_fallback: true
  synthetic_seed: 7
  cache_ttl_seconds: 300
  intraday:
    enabled: true
    interval: 1m
    period: 5d            # last 5 trading days of minute bars — enables time-of-day RVOL
    include_premarket: true
    cache_ttl_seconds: 60

watchlists:
  default:
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - SPY
  day_trading:
    - NVDA
    - TSLA
    - AMD
    - META
    - QQQ

features:
  enabled:
    - vwap
    - moving_averages
    - rsi
    - macd
    - atr
    - volume_anomaly
    - volatility
    - support_resistance
    - gap
    - session_levels
    - opening_range
    - trend
    - market_regime
  ma_windows: [9, 20, 50]
  vwap_window: 20
  volume_window: 20
  volatility_window: 20
  support_resistance_window: 30
  opening_range_minutes: 30

models:
  enabled:
    - momentum
    - baseline
    - gaussian_process
    - arima
  horizon_days: 5
  lookback_rows: 180
  momentum:
    continuation_factor: 0.6   # how much of recent realized momentum is projected forward
  baseline:
    recency_decay: 5.0         # exponential emphasis on recent bars in the trend fit (higher = more recent-weighted)
  gaussian_process:
    kernel: matern
    max_train_rows: 160
    n_restarts_optimizer: 0
  arima:
    order: [1, 1, 1]
    max_train_rows: 220

signal_fusion:
  # Model-score scaling. expected_return is judged against a horizon-aware reference
  # move (per_day x horizon_days, floored), not a flat 5%, so a healthy trend
  # forecast is not crushed to zero. Confidence weights the vote down to a floor
  # instead of multiplying it away.
  model_reference_move_per_day_pct: 0.002
  model_reference_move_floor_pct: 0.01
  model_confidence_floor: 0.40
  weights:
    models: 0.40
    technicals: 0.35
    context: 0.20
    sentiment: 0.05
  thresholds:
    long_score: 0.30
    short_score: -0.30
    watch_score: 0.18
    min_confidence: 0.30
    disagreement_penalty: 0.18
    news_no_trade_penalty: 0.15   # soft confidence shave per-decision when the news analysis raises no-trade flags
    # Confidence calibration. Higher component weight lets a clear directional signal
    # with confident models reach actionable confidence instead of stalling at no_trade.
    confidence_score_weight: 0.60
    confidence_component_weight: 0.50
    disagreement_confidence_penalty: 0.12

risk:
  account_size: 100000
  max_risk_per_trade_pct: 0.01
  max_position_fraction: 0.20
  min_risk_reward: 1.25
  atr_stop_multiple: 1.5
  target_r_multiple: 1.5
  min_confidence_for_trade: 0.35
  skip_if_atr_pct_above: 0.12
  min_avg_volume: 500000
  max_entry_distance_from_vwap_pct: 0.08
  max_daily_loss_pct: 0.03
  max_trades_per_day: 5
  stop_after_consecutive_losses: 3
  pdt_warning_enabled: true
  pdt_min_equity: 25000

scanner:
  workers: 4
  default_filters:
    min_abs_change_pct: 0.0
    min_volume_anomaly: 0.0
    max_atr_pct: 0.50
  intraday_provider_note: true

journal:
  enabled: true
  path: data/trade_journal.local.jsonl

context_agent:
  enabled: true
  mind_file: traders.mind.md
  sources:
    - yfinance_news
    - yahoo_search_news
    - google_news_rss
    - manual
  manual_items:
    - source: default
      title: No configured live catalyst source returned a symbol-specific item.
      sentiment: neutral
      impact: 0.0
  news_analysis:
    enabled: true
    use_in_decision: true   # fold the per-symbol news summary into the trade decision (deep-dive only); false restores news-as-display-only
    llm_stance_weight: 0.6  # how much the LLM's net stance (direction x conviction) overrides the keyword catalyst score in the decision
    max_headlines_per_symbol: 50
    fetch_workers: 6
    summary_workers: 2
    source_count_clickthrough: true
    google_news_rss:
      query_template: "{symbol} stock"
      hl: en-US
      gl: US
      ceid: US:en
      timeout_seconds: 10
    categories:
      - earnings_guidance
      - analyst_action
      - sec_filing
      - macro
      - legal_regulatory
      - m_and_a
      - product_business
      - market_sentiment
      - other
    llm:
      enabled: true
      provider: localdeploy
      model: qwen3vl_8b_ollama
      base_url: http://127.0.0.1:8100/v1/chat/completions
      api_key_env: OPENAI_API_KEY
      timeout_seconds: 120
      max_output_tokens: 700
      temperature: 0.1
      fallback_to_heuristic: false
    headline_classifier:
      enabled: true
      provider: localdeploy
      model: qwen3vl_8b_ollama
      base_url: http://127.0.0.1:8100/v1/chat/completions
      timeout_seconds: 120
      max_output_tokens: 1200
      temperature: 0.1
      max_headlines_per_symbol: 30
      workers: 2
      fallback_to_keyword: true
    article_scraping:
      enabled: true
      max_articles_per_symbol: 3
      workers: 6
      timeout_seconds: 8
      max_chars_per_article: 1400
      user_agent: StockPredictor research crawler/0.1

backtest:
  initial_capital: 100000
  lookback_rows: 90
  holding_period_days: 5
  evaluation_step_days: 5
  slippage_bps: 5
  commission_per_trade: 1.00
  use_planned_position_size: true
  model_subset:
    - baseline

dashboard:
  default_symbol: AAPL
  default_watchlist: default
  max_scan_symbols: 10
  education_mode: true   # beginner-friendly mode: glossary, per-screen guides, and "how traders use it" notes on every tooltip (toggle live in the sidebar)
  result_cache:
    enabled: true
    path: data/dashboard_state.local.pkl
    max_age_minutes: 240

horizons:
  default: swing
  profiles:
    intraday:
      horizon_days: 1
      lookback_rows: 30
      atr_stop_multiple: 0.8
      target_r_multiple: 1.5
      entry_cushion_atr: 0.15
      entry_cushion_pct: 0.0015
      weights:
        models: 0.15
        technicals: 0.20
        intraday: 0.45
        context: 0.15
        sentiment: 0.05
    swing:
      horizon_days: 5
      lookback_rows: 180
      atr_stop_multiple: 1.5
      target_r_multiple: 1.5
      entry_cushion_atr: 0.25
      entry_cushion_pct: 0.002
      max_entry_distance_from_vwap_pct: 0.60   # swing entries sit far from a long-window VWAP; intraday stays tight
      weights:
        models: 0.35
        technicals: 0.30
        intraday: 0.10
        context: 0.20
        sentiment: 0.05
    position:
      horizon_days: 20
      lookback_rows: 252
      atr_stop_multiple: 2.5
      target_r_multiple: 2.5
      entry_cushion_atr: 0.40
      entry_cushion_pct: 0.004
      max_entry_distance_from_vwap_pct: 1.00   # position entries are trend-following; do not block on VWAP distance
      weights:
        models: 0.45
        technicals: 0.30
        intraday: 0.0
        context: 0.20
        sentiment: 0.05

market_context:
  enabled: true
  sector_enabled: true
  market_symbols:
    spy: SPY
    qqq: QQQ
    iwm: IWM
    vix: ^VIX
  sector_etf_overrides: {}

calendar:
  earnings_enabled: true
  macro_events: []   # e.g. [{date: "2026-06-12", time: "08:30", label: "CPI", impact: "high"}]

snapshots:
  enabled: true
  path: data/analysis_snapshots.local.jsonl
  compare_window: 5
